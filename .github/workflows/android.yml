name: Build APK (Open-Meteo)

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle

      - name: Install Android platform / build tools
        env:
          # Newer cmdline-tools sdkmanager requires JDK 17; the Gradle build
          # itself still runs on JDK 11. Skip the version check only here.
          # (android-actions/setup-android was removed: its license step failed
          # under JDK 11 for the same reason, and the SDK is preinstalled.)
          SKIP_JDK_VERSION_CHECK: 'true'
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKM" --install "platforms;android-32" "build-tools;30.0.3" "platform-tools" > /dev/null
          yes | "$SDKM" --licenses > /dev/null || true

      - name: Smoke-test the weather endpoint
        run: |
          curl -fsS --max-time 20 \
            "https://api.open-meteo.com/v1/forecast?latitude=39.9042&longitude=116.4074&current=temperature_2m,weather_code&timezone=auto" \
            | head -c 300
          echo ""

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build fdroid debug APK
        run: ./gradlew assembleFdroidDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p output
          APK=$(find app/build/outputs/apk/fdroid/debug -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "No APK produced" >&2
            find app/build/outputs -maxdepth 5 -type f | head -50
            exit 1
          fi
          cp "$APK" output/GeometricWeather-OpenMeteo.apk
          ls -lh output/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeometricWeather-OpenMeteo
          path: output/*.apk
          if-no-files-found: error

      - name: Publish a downloadable release
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: openmeteo-build-${{ github.run_number }}
          name: GeometricWeather (Open-Meteo) build ${{ github.run_number }}
          files: output/GeometricWeather-OpenMeteo.apk
          body: |
            GeometricWeather 3.102 with a working, keyless Open-Meteo data source.

            - Weather / hourly / 7-day forecast, UV, air quality (CAMS)
            - City search via Open-Meteo geocoding
            - No API key required; default source is Open-Meteo on first launch
            - fdroid debug build, no proprietary SDK, installs on arm64 devices
              such as the Samsung Galaxy S25 Ultra

            Built entirely by GitHub Actions from this commit.
